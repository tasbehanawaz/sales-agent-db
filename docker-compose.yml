# Sales Agent MSSQL Database
# For Token Bazaar server deployment:
# - Ensure port 1433 is open on the firewall
# - Update DB_HOST in .env to server IP (35.240.218.50)
# - Update MSSQL_PASSWORD in .env if needed (default: Sales@Agent123)

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sales-agent-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-Sales@Agent123}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
      - ./init/mssql:/mssql-scripts
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_PASSWORD:-Sales@Agent123}", "-Q", "SELECT 1", "-b"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sales-agent-net

volumes:
  mssql_data:

networks:
  sales-agent-net:
    driver: bridge
